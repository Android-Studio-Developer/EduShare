<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Google Classroom" />
    <title>Google Classroom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
      try {
        var v = localStorage.getItem("edushare-ui-version");
        if (v !== "v1") document.documentElement.setAttribute("data-ui-version", "v2");
        if (localStorage.getItem("edushare-reduce-motion") === "1") document.documentElement.setAttribute("data-reduce-motion", "1");
        if (localStorage.getItem("edushare-text-size") === "large") document.documentElement.setAttribute("data-text-size", "large");
        if (localStorage.getItem("edushare-high-contrast") === "1") document.documentElement.setAttribute("data-high-contrast", "1");
      } catch (e) {}
    </script>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
