<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sdos-shell" x1="18" y1="12" x2="111" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2740"/>
      <stop offset="0.52" stop-color="#0B1425"/>
      <stop offset="1" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="sdos-rim" x1="22" y1="11" x2="104" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DBBFF"/>
      <stop offset="0.42" stop-color="#4D7CFE"/>
      <stop offset="1" stop-color="#1D3E9D"/>
    </linearGradient>
    <linearGradient id="sdos-ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DBBFF"/>
      <stop offset="1" stop-color="#3E68E0"/>
    </linearGradient>
    <linearGradient id="sdos-grass" x1="64" y1="27" x2="64" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F36A"/>
      <stop offset="1" stop-color="#55B83E"/>
    </linearGradient>
    <linearGradient id="sdos-dirt-left" x1="42" y1="49" x2="62" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A76A43"/>
      <stop offset="1" stop-color="#68402F"/>
    </linearGradient>
    <linearGradient id="sdos-dirt-right" x1="86" y1="49" x2="66" y2="77" gradientUnits="userSpaceOnUse">
      <stop stop-color="#704632"/>
      <stop offset="1" stop-color="#3D2A25"/>
    </linearGradient>
    <radialGradient id="sdos-aura" cx="0" cy="0" r="1" gradientTransform="translate(64 67) rotate(90) scale(48)">
      <stop stop-color="#4D7CFE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4D7CFE" stop-opacity="0"/>
    </radialGradient>
    <filter id="sdos-shadow" x="5" y="7" width="118" height="118" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#030711" flood-opacity="0.65"/>
    </filter>
    <filter id="sdos-symbol-shadow" x="13" y="18" width="102" height="101" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#315FE8" flood-opacity="0.3"/>
    </filter>
    <clipPath id="sdos-clip"><rect x="8" y="8" width="112" height="112" rx="30"/></clipPath>
  </defs>

  <g filter="url(#sdos-shadow)">
    <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#sdos-shell)"/>
    <rect x="9" y="9" width="110" height="110" rx="29" stroke="url(#sdos-rim)" stroke-width="2"/>
  </g>

  <g clip-path="url(#sdos-clip)">
    <circle cx="64" cy="67" r="48" fill="url(#sdos-aura)"/>
    <path d="M13 30C38 15 82 12 117 33" stroke="white" stroke-opacity="0.08" stroke-width="12" stroke-linecap="round"/>
    <path d="M23 111L110 24" stroke="#78A4FF" stroke-opacity="0.055" stroke-width="1"/>
    <path d="M13 95L96 12" stroke="#78A4FF" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <g filter="url(#sdos-symbol-shadow)">
    <!-- Spawn reticle: a wide locator ring anchoring the block -->
    <circle cx="64" cy="67" r="40" stroke="url(#sdos-ring)" stroke-width="2.4" stroke-opacity="0.5" stroke-dasharray="5 8"/>
    <path d="M64 23V33M64 101V111M20 67H30M98 67H108" stroke="url(#sdos-ring)" stroke-width="3" stroke-linecap="round"/>

    <!-- Minimal isometric voxel block. -->
    <path d="M64 24L88 37L64 50L40 37L64 24Z" fill="url(#sdos-grass)"/>
    <path d="M40 37L64 50V78L40 65V37Z" fill="url(#sdos-dirt-left)"/>
    <path d="M88 37L64 50V78L88 65V37Z" fill="url(#sdos-dirt-right)"/>
    <path d="M40 37L64 50L88 37V44L64 57L40 44V37Z" fill="#3F963A"/>

    <!-- Sparse voxel details, deliberately chunky rather than noisy. -->
    <path d="M47 49L53 52.2V58.2L47 55V49Z" fill="#C08355"/>
    <path d="M55 62L61 65.2V71.2L55 68V62Z" fill="#553329"/>
    <path d="M75 53L82 49.2V55.2L75 59V53Z" fill="#8A5940"/>
    <path d="M68 65L73 62.3V68.3L68 71V65Z" fill="#2F2322"/>
    <path d="M51.8 32.4L58 29L64.2 32.4L58 35.8L51.8 32.4Z" fill="#D2FF88" fill-opacity="0.7"/>

    <!-- Dex index panel: directory / listing mark -->
    <rect x="80" y="82" width="30" height="26" rx="7" fill="#11151d" stroke="url(#sdos-ring)" stroke-opacity="0.6" stroke-width="1.6"/>
    <path d="M86.5 89.5H103.5M86.5 95H103.5M86.5 100.5H97" stroke="#A3E635" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Small OS status light and a single restrained sparkle. -->
  <circle cx="101" cy="27" r="3.5" fill="#70F0BD"/>
  <circle cx="101" cy="27" r="6.5" stroke="#70F0BD" stroke-opacity="0.18"/>
  <path d="M27 25L28.6 29.4L33 31L28.6 32.6L27 37L25.4 32.6L21 31L25.4 29.4L27 25Z" fill="#DCE7FF" fill-opacity="0.9"/>
</svg>
